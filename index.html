<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101028">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>アイアンウォーカー</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lib/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map"></div>

  <!-- 上部ステータス -->
  <div id="hud" class="win">
    <div class="hud-row">
      <span id="hud-name">アイアン</span>
      <span>Lv <b id="hud-lv">1</b></span>
      <span><b id="hud-gold">0</b> C</span>
    </div>
    <div class="hud-row bars">
      <div class="bar"><label>HP</label><div class="gauge"><i id="hud-hpbar"></i></div><span id="hud-hp">30/30</span></div>
      <div class="bar"><label>EN</label><div class="gauge mp"><i id="hud-mpbar"></i></div><span id="hud-mp">10/10</span></div>
    </div>
    <div class="hud-row sub">
      <span id="hud-gps">GPS: 探しています…</span>
      <span>移動 <b id="hud-walk">0</b> m</span>
    </div>
  </div>

  <!-- 地図ボタン -->
  <div id="map-buttons">
    <button id="btn-walk" class="walk-btn" aria-pressed="false">
      <span class="walk-ic" aria-hidden="true">🚶</span>
      <span class="walk-label">ウォーク<br>モード</span>
      <b class="walk-state">OFF</b>
    </button>
    <button id="btn-center" class="round" aria-label="現在地へ">◎</button>
  </div>

  <!-- デモ用十字キー -->
  <div id="dpad" class="hidden">
    <button data-dir="n">▲</button>
    <button data-dir="w">◀</button>
    <button data-dir="e">▶</button>
    <button data-dir="s">▼</button>
  </div>

  <!-- 下部メニュー -->
  <nav id="nav" class="win">
    <button data-open="status">機体</button>
    <button data-open="items">アイテム</button>
    <button data-open="book">図鑑</button>
    <button data-open="settings">設定</button>
  </nav>

  <div id="toast" class="win hidden"></div>

  <!-- 汎用モーダル -->
  <div id="modal" class="overlay hidden">
    <div class="win modal-body">
      <div id="modal-title"></div>
      <div id="modal-content"></div>
      <button id="modal-close" class="cmd">とじる</button>
    </div>
  </div>

  <!-- バトル画面 -->
  <div id="battle" class="hidden">
    <div id="battle-bg"></div>
    <div id="battle-crest" aria-hidden="true">
      <svg viewBox="0 0 240 24"><g fill="none" stroke="#ff9a2e" stroke-width="2"><path d="M4 12h86M150 12h86"/><path d="M90 12l10-8 10 8-10 8z"/><path d="M130 12l10-8 10 8-10 8z"/></g><circle cx="120" cy="12" r="9" fill="#1b1f25" stroke="#ff9a2e" stroke-width="2"/><path d="M120 5v14M113 12h14" stroke="#7ff0ff" stroke-width="2"/></svg>
    </div>
    <div id="battle-field">
      <div id="enemy-wrap">
        <div id="enemy-name"></div>
        <div id="enemy-hp" class="gauge enemy"><i></i></div>
        <div id="enemy-icon"></div>
        <div class="enemy-shadow"></div>
      </div>
      <div id="dmg-pop"></div>
    </div>
    <div id="battle-fx" aria-hidden="true"></div>
    <div id="battle-party"></div>
    <div id="battle-panel">
      <div id="battle-msg"></div>
      <div id="battle-cmds" class="hidden">
        <button class="bcmd" data-cmd="attack">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M38 6l4 4-22 22-4-4z" fill="#e8eef7" stroke="#59626e" stroke-width="2"/><path d="M14 26l8 8-3 3-8-8z" fill="#f2c14e" stroke="#7a5418" stroke-width="2"/><path d="M12 34l2 2-6 6-2-2z" fill="#8a4b22" stroke="#4a2810" stroke-width="2"/></svg>
          <span>攻撃</span>
        </button>
        <button class="bcmd" data-cmd="spell">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M28 3L10 27h12l-4 18 20-26H26z" fill="#7ff0ff" stroke="#1b6a85" stroke-width="2.5" stroke-linejoin="round"/><path d="M25 9l-9 13" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8"/></svg>
          <span>スキル</span>
        </button>
        <button class="bcmd" data-cmd="item">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M17 14v-4h14v4" fill="none" stroke="#b7c0cc" stroke-width="3.5"/><rect x="6" y="14" width="36" height="26" rx="4" fill="#ff9a2e" stroke="#7a3a0a" stroke-width="2.5"/><rect x="6" y="22" width="36" height="4" fill="#d9701a"/><path d="M20 30l8-8m-2 0l4 0 0 4" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/><ellipse cx="14" cy="18" rx="5" ry="1.6" fill="#ffd9a8" opacity=".8"/></svg>
          <span>アイテム</span>
        </button>
        <button class="bcmd" data-cmd="guard">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4l16 6v12c0 11-7 18-16 22C15 40 8 33 8 22V10z" fill="#d8323a" stroke="#6e1218" stroke-width="2.5"/><path d="M24 9l11 4v9c0 8-5 13-11 16" fill="none" stroke="#ff8a8f" stroke-width="2"/></svg>
          <span>防御</span>
        </button>
      </div>
      <div id="battle-sub" class="hidden"></div>
    </div>
    <div id="battle-row">
      <button id="btn-run" class="bround" data-cmd="run">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 30c6-2 10-8 18-8 6 0 10 3 14 6-5 0-8 2-10 5-4-3-10-3-22-3z" fill="#bfa2ff" stroke="#5a3f9e" stroke-width="2"/><path d="M6 36h12M10 41h10" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
        <span>撤退</span>
      </button>
      <button id="btn-auto" class="bauto" aria-pressed="false">
        <svg viewBox="0 0 48 24" aria-hidden="true"><path d="M4 3l14 9-14 9zM22 3l14 9-14 9z" fill="#ffd34d" stroke="#a8761c" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <span>オートバトル</span>
      </button>
    </div>
  </div>

  <!-- タイトル -->
  <div id="title" class="overlay">
    <div class="title-bg-blur" aria-hidden="true"></div>
    <img id="title-bg" src="images/title.jpg" alt="">
    <div class="title-shade"></div>
    <div class="title-box">
      <div class="title-top">
        <!-- ロゴは背景画像に入っているので、文字は読み上げ用にだけ残す -->
        <h1 class="sr-only">アイアンウォーカー</h1>
        <p class="sr-only">歩いて 戦う 位置情報ロボットRPG</p>
      </div>
      <div class="title-bottom">
        <div id="title-new" class="hidden">
          <label>パイロット名を 入力してください</label>
          <input id="name-input" maxlength="6" value="アイアン">
        </div>
        <button id="btn-start" class="cmd big">▶ 出撃する</button>
        <button id="btn-demo" class="cmd">デモモードで 遊ぶ</button>
        <p class="title-note">※ 位置情報を使います。歩きスマホは危険です。<br>まわりに気をつけて 遊びましょう。</p>
        <p id="app-version" class="title-note"></p>
      </div>
    </div>
  </div>
  </div>

  <script src="lib/leaflet/leaflet.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
